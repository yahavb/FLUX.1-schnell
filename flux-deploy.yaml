apiVersion: v1
kind: Service
metadata:
  name: flux
  namespace: default
spec:
  selector:
    app: flux
  ports:
    - port: 8000
      targetPort: 8000
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flux
  template:
    metadata:
      labels:
        app: flux
    spec:
      nodeSelector:
        node-type: trn3-dev1
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc2
      containers:
        - name: app
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euxo pipefail

              # Clone the FLUX.1-schnell project (serve.py + nki_upsample.py + requirements).
              git clone -b "${BRANCH:-master}" https://github.com/yahavb/FLUX.1-schnell.git repo
              cd repo

              # New DLC image has no auto-activated venv -> target system python3 via --python.
              UVPY="$(command -v python3)"
              echo "uv target interpreter: $UVPY"
              uv pip install --python "$UVPY" -r requirements.txt

              # HF login (new SDK: `hf`, not `huggingface-cli`) + local HF cache (/var/mdl is
              # S3/mountpoint-s3 which lacks os.replace -> hf_hub_download fails Errno 38).
              export HF_TOKEN
              hf auth login --token "$HF_TOKEN" || true
              export HF_HOME=/tmp/hf
              mkdir -p "$HF_HOME"

              # GATE: prove the NKI nearest-upsample kernel is correct (kernel on neuron vs
              # CPU reference, exact match) BEFORE launching the pipeline. If the kernel is
              # wrong, fail here — do NOT waste a full model load + compile on a broken VAE.
              echo "============================================"
              echo "  KERNEL GATE: test_nki_upsample.py (must PASS before serving)"
              echo "============================================"
              python3 test_nki_upsample.py | tee /tmp/kerneltest.log
              grep -q "ALL PASS" /tmp/kerneltest.log || { echo "NKI upsample kernel FAILED — not launching pipeline"; exit 1; }

              echo "============================================"
              echo "  flux (FLUX.1-schnell) on Trainium — single core, FF torch.compiled"
              echo "  ${WIDTH}x${HEIGHT}, ${NUM_STEPS} steps, guidance ${GUIDANCE_SCALE}, mode ${FLUX_COMPILE_MODE}"
              echo "============================================"

              # SINGLE CORE, plain python3 (no torchrun/TP). serve.py pins
              # NEURON_RT_VISIBLE_CORES=0, runs text encoders eager on host, compiles the
              # transformer FF submodules (attn eager — compiling flux attn NaNs), VAE fp32.
              python3 serve.py
          resources:
            claims:
              - name: neurons
            requests:
              cpu: 11
              memory: 120Gi
              ephemeral-storage: 120Gi
            limits:
              cpu: 11 
              memory: 120Gi
              ephemeral-storage: 120Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: TORCH_NEURONX_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_FLAGS
              value: "--model-type=transformer"
            - name: NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE
              value: "134217728"
            # PROVEN serve config (bench run cl8rs): compile the transformer FF submodules,
            # keep attention EAGER (compiling flux attn -> NaN/black image on this SDK).
            # Correct image, ~4770ms/img at 640x480, single core.
            - name: FLUX_COMPILE_MODE
              value: "ff_only"
            - name: MODEL_NAME
              value: "black-forest-labs/FLUX.1-schnell"
            - name: HEIGHT
              value: "480"
            - name: WIDTH
              value: "640"
            - name: NUM_STEPS
              value: "4"
            - name: GUIDANCE_SCALE
              value: "0.0"
            - name: MAX_SEQ_LEN
              value: "256"
            - name: DTYPE
              value: "bfloat16"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
          ports:
            - containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 475        # first-call NEFF compile can take many minutes
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 600
            periodSeconds: 300
            failureThreshold: 1000
            timeoutSeconds: 60
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
