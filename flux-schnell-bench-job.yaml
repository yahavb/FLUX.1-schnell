# FLUX.1-schnell 3-run benchmark / bring-up JOB (neuron-3run-benchmark skill).
#
# WHY a Job, not the Deployment: the Deployment recycles on a compile failure —
# the container exits, k8s restarts it, and the root-cause compile log scrolls
# away. This Job is restartPolicy=Never + backoffLimit=0, so it runs ONCE and the
# full failure survives in `kubectl logs`. Entrypoint is bench.py, which
# torch.compile()s EVERY component (CLIP + T5 text encoders, DiT transformer, VAE
# decoder latent->pixel) with NEURON_LAUNCH_BLOCKING=1 so a failure names the op.
#
# Launch:
#   kubectl delete job flux-schnell-bench --ignore-not-found
#   kubectl apply -f flux-schnell-bench-job.yaml
#   kubectl logs -f job/flux-schnell-bench
apiVersion: batch/v1
kind: Job
metadata:
  name: flux-schnell-bench
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: flux-schnell-bench
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn3
      resourceClaims:
        # s-lnc2-trn3 = 1 device = 4 NeuronCores x 24GB = 96GB. TP=4 across the cores.
        - name: s-lnc2-trn3
          resourceClaimTemplateName: s-lnc2-trn3
      containers:
        - name: bench
          image: 621547421844.dkr.ecr.us-west-2.amazonaws.com/native-pytorch:2.11.0-neuronx-py312-sdk2.31.0-ubuntu24.04-neurondlcbuilder-development-6486001458-0
          imagePullPolicy: Always
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euxo pipefail

              # ─── Clone the FLUX.1-schnell project (serve.py + bench.py + nki + scripts) ───
              git clone -b "${BRANCH:-master}" https://github.com/yahavb/FLUX.1-schnell.git repo
              cd repo

              # ── PROVENANCE part 1: which code (no deps needed; right after clone) ──
              GIT_SHA=$(git rev-parse HEAD); GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
              echo "┌── PROVENANCE ──"
              echo "│ branch : $GIT_BRANCH (requested: ${BRANCH:-master})"
              echo "│ commit : $GIT_SHA"
              echo "│ subject: $(git log -1 --pretty=%s)"
              echo "└────────────────"

              # New DLC image has no auto-activated venv -> target system python3 via --python.
              UVPY="$(command -v python3)"
              echo "uv target interpreter: $UVPY"
              uv pip install --python "$UVPY" -r requirements.txt

              # ── PROVENANCE part 2: feature flag (AFTER dep install — needs torch) ──
              PROBE='import serve; print("MODEL="+serve.MODEL_NAME, "res="+str(serve.WIDTH)+"x"+str(serve.HEIGHT), "steps="+str(serve.NUM_STEPS), "dtype="+str(serve.DTYPE))'
              echo "PROVENANCE FEATURE: $(python3 -c "$PROBE" 2>&1 | tr '\n' ' ')"

              # HF login (new SDK: `hf`, not `huggingface-cli`) + LOCAL HF cache (/var/mdl is
              # S3/mountpoint-s3 which lacks os.replace -> hf_hub_download fails Errno 38).
              export HF_TOKEN
              hf auth login --token "$HF_TOKEN" || true
              export HF_HOME=/tmp/hf
              mkdir -p "$HF_HOME"

              LOCAL_RESULTS=/tmp/results; mkdir -p "$LOCAL_RESULTS"
              export TORCH_NEURONX_NEFF_CACHE_DIR=/tmp/neff_cache
              mkdir -p /tmp/neff_cache

              # GATE 1: prove the NKI nearest-upsample kernel is correct (kernel on neuron vs
              # CPU reference, exact match) BEFORE the full pipeline. If wrong, fail here.
              echo "════════════ KERNEL GATE: test_nki_upsample.py ════════════"
              python3 test_nki_upsample.py | tee /tmp/kerneltest.log
              grep -q "ALL PASS" /tmp/kerneltest.log || { echo "NKI upsample kernel FAILED — aborting"; exit 1; }

              echo "════════════ NEURON 3-RUN BENCHMARK (flux-schnell) ════════════"
              echo "  reference: (bring-up — establish clean latency, no external ref yet)"
              echo "  NOTE: cold compile expected (no NEFF cache tar) — [1/3] built= will be large."
              echo "==============================================================="

              CACHE_BEFORE=$(find /tmp/neff_cache -name '*.neff' 2>/dev/null | wc -l)
              echo "NEFFs in cache before: $CACHE_BEFORE (0 = cold compile)"

              # SINGLE CORE: plain python3 on core 0 (NEURON_RT_VISIBLE_CORES set in serve.py).
              # No torchrun / no TP / no collectives — matches the proven pave t2i recipe.
              # DO NOT grep-filter warmup (it hid all compile progress -> looked hung for 2h);
              # stream the full output so per-block compile is visible.
              # Judge success on the ACTUAL marker in the tee'd file, NOT the pipe exit
              # code — `cmd | tee | grep || echo FAILED` fires on grep's exit even when the
              # run succeeded (prior logs showed bogus "WARMUP FAILED" after built=/median=).
              echo "=== [1/3] WARMUP (compile transformer per-block + VAE; not timed) ==="
              python3 bench.py --warmup 1 --iters 0 2>&1 | tee "$LOCAL_RESULTS/warmup.txt" || true
              grep -q "built=" "$LOCAL_RESULTS/warmup.txt" && echo "WARMUP OK" || echo "WARMUP FAILED"

              echo "=== [2/3] CLEAN RUN (NO profiler) — median of 5 = REAL LATENCY ==="
              python3 bench.py --warmup 1 --iters 5 2>&1 | tee "$LOCAL_RESULTS/clean.txt" | grep -iE "built=|median|throughput|VALIDATE|saved:|iter " || true
              grep -q "median=" "$LOCAL_RESULTS/clean.txt" && echo "CLEAN RUN OK" || echo "CLEAN RUN FAILED"
              T_CLEAN=$(grep -oE "median=[0-9.]+ms" "$LOCAL_RESULTS/clean.txt" | head -1)

              echo "=== [3/3] PROFILED RUN (NEURON_RT_INSPECT_ENABLE=1 — overhead delta) ==="
              NEURON_RT_INSPECT_ENABLE=1 \
              python3 bench.py --warmup 1 --iters 5 2>&1 | tee "$LOCAL_RESULTS/profiled.txt" | grep -iE "built=|median|throughput" || true
              grep -q "median=" "$LOCAL_RESULTS/profiled.txt" && echo "PROFILED RUN OK" || echo "PROFILED RUN FAILED"
              T_PROF=$(grep -oE "median=[0-9.]+ms" "$LOCAL_RESULTS/profiled.txt" | head -1)

              echo "=== [4] per-NEFF engine breakdown + dominant-NEFF metrics (neuron-profile CLI) ==="
              POUT=/tmp/perneff_prof; rm -rf "$POUT"; mkdir -p "$POUT"
              mapfile -t NEFFS < <(find /tmp/neff_cache -name "*.neff" 2>/dev/null | sort)
              echo "NEFFs in cache: ${#NEFFS[@]}"
              OK=0
              for neff in "${NEFFS[@]}"; do
                hash=$(basename "$neff" .neff); ntff="$POUT/${hash}.ntff"; json="$POUT/${hash}.json"
                NEURON_RT_ENABLE_DGE_NOTIFICATIONS=1 timeout 180 \
                  neuron-profile capture --single-io -n "$neff" -s "$ntff" >/dev/null 2>&1 || continue
                [ -f "$ntff" ] || continue
                timeout 120 neuron-profile view -n "$neff" -s "$ntff" --output-format summary-json > "$json" 2>/dev/null || true
                [ -s "$json" ] && OK=$((OK+1))
              done
              echo "captured+viewed OK: $OK / ${#NEFFS[@]}"
              python3 scripts/neuron/profile_all_neffs.py "$POUT" 2>&1 | tee "$LOCAL_RESULTS/perneff_breakdown.txt" || echo "aggregation failed"
              BIGHASH=$(python3 scripts/neuron/pick_neffs.py "$POUT" /tmp/neff_cache | head -1 || true)
              BIGNEFF=$(find /tmp/neff_cache -name "${BIGHASH}.neff" 2>/dev/null | head -1)
              if [ -n "$BIGNEFF" ] && [ -f "$POUT/${BIGHASH}.ntff" ]; then
                echo "═══ dominant NEFF detail (summary-text) ═══" | tee "$LOCAL_RESULTS/hotspots_${BIGHASH}.txt"
                timeout 180 neuron-profile view -n "$BIGNEFF" -s "$POUT/${BIGHASH}.ntff" \
                  --output-format summary-text 2>/dev/null | tee -a "$LOCAL_RESULTS/hotspots_${BIGHASH}.txt" || echo "  view failed"
              fi

              echo "=== PROFILER-OVERHEAD COMPARISON ==="
              echo "  clean    (no profiler, REAL latency) : ${T_CLEAN:-N/A}"
              echo "  profiled (profiler on)               : ${T_PROF:-N/A}"
              echo "  (compare engine SHARES from run 3, not absolute µs)"

              # ─── PERSIST TO PVC (/var/mdl is S3-backed and SURVIVES the pod; /tmp does
              #     NOT — the Job's pod is deleted on completion and takes /tmp with it).
              #     Copy the RAW PNG (viewable, not tarred) to a timestamped dir, LOUDLY:
              #     no 2>/dev/null hiding a failed copy, and fail the step if the image
              #     didn't land, so we never silently lose the output. ───
              TS=$(date +%Y%m%d_%H%M%S)
              OUT_DIR="/var/mdl/flux_schnell/runs/${TS}"
              mkdir -p "$OUT_DIR"
              if [ -f /tmp/flux_out.png ]; then
                cp /tmp/flux_out.png "$OUT_DIR/flux_out.png"
                cp "$LOCAL_RESULTS"/*.txt "$OUT_DIR/" 2>/dev/null || true
                ls -la "$OUT_DIR/flux_out.png"
                echo "SAVED IMAGE -> $OUT_DIR/flux_out.png   (pull: kubectl cp does NOT work post-Job; read it off the PVC)"
              else
                echo "ERROR: /tmp/flux_out.png missing — generation did not produce an image"
              fi
              # bonus: full results tar alongside the raw png
              tar -czf "$OUT_DIR/results.tar.gz" -C "$(dirname "$LOCAL_RESULTS")" "$(basename "$LOCAL_RESULTS")" 2>/dev/null || true
              echo "════════════ BENCH DONE ════════════"
          resources:
            claims:
              - name: s-lnc2-trn3
            # s-lnc2-trn3 = 1 device/pod. ephemeral-storage explicit: /tmp holds the HF model
            # cache + NEFF cache + profiler NTFFs -> avoid disk-pressure eviction (Exit 137).
            requests:
              cpu: 22
              memory: 122Gi
              ephemeral-storage: 100Gi
            limits:
              cpu: 44
              memory: 200Gi
              ephemeral-storage: 200Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # Experiment branch: per-block transformer compile (the [F139] fix). Keep on
            # exp/ until validated; only merge to master once the run is clean.
            - name: BRANCH
              value: "exp/per-block-compile"
            - name: NEURON_RT_LOG_LEVEL
              value: "INFO"
            - name: NEURON_CC_LOG_LEVEL
              value: "INFO"
            - name: TORCH_NEURONX_LOG_LEVEL
              value: "INFO"
            - name: NEURON_CC_FLAGS
              value: "--model-type=transformer"
            - name: NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE
              value: "134217728"
            # Single-core (no TP): serve.py pins NEURON_RT_VISIBLE_CORES=0 and runs the
            # whole pipeline on one core, matching the proven pave t2i recipe. The pave
            # opt-log (#15/#16/#17) shows every inter-core split regressed for diffusion.
            - name: MODEL_NAME
              value: "black-forest-labs/FLUX.1-schnell"
            - name: HEIGHT
              value: "480"
            - name: WIDTH
              value: "640"
            - name: NUM_STEPS
              value: "4"
            - name: GUIDANCE_SCALE
              value: "0.0"
            - name: MAX_SEQ_LEN
              value: "256"
            - name: DTYPE
              value: "bfloat16"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
